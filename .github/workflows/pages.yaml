# Publishes the user documentation and the trace viewer to GitHub Pages.
#
# Both are BUILT here rather than committed: `site/` holds only generated
# artifacts (gitignored), sourced from `pages/` and `viewer/` respectively, so
# baking them in CI keeps one source of truth. The DATA behind the viewer is the
# exception — a run needs a model and upstream access, neither of which exists
# here, so one real run is committed under `evals/runs/` and baked in from there.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Стоит до сборки: если Pages в репозитории не включён (Settings ->
      # Pages -> Source: GitHub Actions), прогон падает здесь, а не после
      # установки зависимостей и генерации сайта. Включить автоматически
      # нельзя: GITHUB_TOKEN не имеет прав на создание Pages-сайта.
      - uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      # The public MCP endpoint is a repo variable, so redeploying the server
      # doesn't mean editing HTML. `tutu.py docs` fills in __DEPLOY_URL__ itself
      # (pages/build.py) — unset (e.g. on a fork), it falls back to the local
      # address, so the page never shows a raw placeholder to a reader.
      # The viewer is baked from a COMMITTED snapshot of a real eval run
      # (`evals/runs/`), not from the demo traces: CI has neither an OpenAI key
      # nor upstream access, and demo traces cover three of the set's twenty-two
      # scenarios with hand-written answers — a showcase that undersells the run
      # it is meant to show. `make demo-traces` still exists for working on the
      # viewer itself before any run exists.
      - name: Build the docs page and the trace viewer
        env:
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
        run: make site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
