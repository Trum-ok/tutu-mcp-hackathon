# Publishes the user documentation and the trace viewer to GitHub Pages.
#
# Both are BUILT here rather than committed: `site/` holds only generated
# artifacts (gitignored), sourced from `pages/` and `viewer/` respectively, so
# baking them in CI keeps one source of truth. The viewer is built from the
# hand-written demo traces, which need no model and no API key — a real eval
# run's `out/eval-results.json` never leaves a laptop.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `enablement` включает Pages через API, если он ещё не включён в
      # настройках репозитория, — иначе первый прогон падает на 404 «Get Pages
      # site failed». Шаг стоит до сборки: незачем собирать сайт, которому
      # некуда деплоиться.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      # The public MCP endpoint is a repo variable, so redeploying the server
      # doesn't mean editing HTML. `tutu.py docs` fills in __DEPLOY_URL__ itself
      # (pages/build.py) — unset (e.g. on a fork), it falls back to the local
      # address, so the page never shows a raw placeholder to a reader.
      - name: Build the docs page and the trace viewer from demo traces
        env:
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
        run: |
          uv run python tutu.py docs
          uv run python tutu.py demo
          uv run python tutu.py viewer \
            --data out/eval-results.demo.json \
            --out site/trace-viewer.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
