# Publishes the user documentation and the trace viewer to GitHub Pages.
#
# The viewer is BUILT here rather than committed: `viewer/trace-viewer.html` is a
# generated artifact (and gitignored), so baking it in CI keeps one source of
# truth. It is built from the hand-written demo traces, which need no model and
# no API key — a real eval run's `eval-results.json` never leaves a laptop.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Build the trace viewer from demo traces
        run: |
          uv run python scripts/demo_traces.py
          uv run python viewer/build.py \
            --data eval-results.demo.json \
            --out site/trace-viewer.html

      # The public MCP endpoint is a repo variable, so redeploying the server
      # doesn't mean editing HTML. Unset (e.g. on a fork) falls back to the local
      # address, so the page never shows a raw placeholder to a reader.
      - name: Fill in the MCP endpoint
        env:
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
        run: |
          URL="${MCP_PUBLIC_URL:-http://127.0.0.1:8800/mcp}"
          echo "endpoint: $URL"
          sed -i "s|__DEPLOY_URL__|${URL}|g" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
