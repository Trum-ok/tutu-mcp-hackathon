name: lint

on:
  push:
  pull_request:

env:
  LINT_PATHS: tutu.py tutu_mcp evals viewer tests

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check $LINT_PATHS

      - name: ruff (format)
        run: uv run ruff format --check $LINT_PATHS

      - name: ty
        run: uv run ty check tutu.py tutu_mcp evals viewer

  lint-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Biome
        run: npm ci

      - name: biome
        run: npx --no biome ci viewer tests
